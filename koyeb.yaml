# Compass web — deploy from the repository ROOT with the Docker builder.
# Do NOT set Work directory to apps/web (buildpacks cannot see pnpm-lock.yaml).
name: compass-web
services:
  - name: web
    type: web
    regions:
      - fra
    env:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SITE_URL
        value: https://getcompass.space
      - key: PORT
        value: "3000"
    instance_types:
      - type: free
    ports:
      - port: 3000
        protocol: http
    routes:
      - path: /
        port: 3000
    health_checks:
      - grace_period: 30
        interval: 30
        restart_limit: 3
        timeout: 5
        path: /
        port: 3000
        protocol: http
    docker:
      dockerfile: Dockerfile
      docker_context: .
