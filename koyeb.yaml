name: compass-web
services:
  - name: web
    type: web
    regions:
      - fra
    env:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SITE_URL
        value: https://getcompass.space
    instance_types:
      - type: free
    ports:
      - port: 3000
        protocol: http
    routes:
      - path: /
        port: 3000
    health_checks:
      - grace_period: 30
        interval: 30
        restart_limit: 3
        timeout: 5
        path: /
        port: 3000
        protocol: http
    docker:
      dockerfile: ./apps/web/Dockerfile
      docker_context: .
